# A single-host production deployment: PostgreSQL on a named volume, schema migrations as a
# one-shot service that has to succeed before vfps starts, and vfps with OIDC authentication on.
# CI publishes this file as an OCI artifact next to the image it runs:
#
#   docker compose --env-file vfps.env -f oci://ghcr.io/miracum/vfps/compose/production:<version> up -d
#
# Every value without a safe default is a required variable, so a missing one stops `up` before
# any container is created rather than surfacing as a failed sign-in later. Anything else is set
# the usual Compose way, in an override file passed as a second -f after the artifact - see
# website/deployment/compose.md.
#
# What this stack does not do for you: TLS. vfps serves plain HTTP on 8080 and plaintext gRPC on
# 8081, published on VFPS_BIND_ADDRESS (127.0.0.1 unless set) so that nothing is reachable from
# another host until a TLS-terminating reverse proxy is in front of it. Backups of the
# postgresql-data volume are yours as well: it holds every pseudonym.
#
# The artifact holds this file and nothing else, so it has to stay self-contained: no bind mounts
# (Compose publishes the mount declaration, not the file behind it) and no build section. Image
# tags are pinned to digests at publish time by an overlay `docker compose publish
# --resolve-image-digests` adds, which also means VFPS_IMAGE_TAG has no effect on the published
# artifact - it exists for CI, to run a pull request's own image from a checkout.

# Not plain "vfps": that is the project name Compose derives for the development stack in
# compose.yaml at the root of a checkout named vfps, and an `up` here would take over its
# postgresql container.
name: vfps-production

x-vfps-database-env: &vfps-database-env
  ConnectionStrings__PostgreSQL: "Host=postgresql:5432;Database=vfps;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to the password for the bundled PostgreSQL}

services:
  postgresql:
    image: docker.io/library/postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to the password for the bundled PostgreSQL}
      POSTGRES_DB: vfps
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      # over TCP rather than the default Unix socket: while the image initializes a new data
      # directory it runs a temporary server that listens on the socket only, which would pass a
      # socket check just before it is shut down again
      test:
        - CMD
        - pg_isready
        - --host=127.0.0.1
        - --username=postgres
        - --dbname=vfps
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Runs on every `up` and exits; vfps only starts once it has exited successfully. Applying
  # migrations here rather than through ForceRunDatabaseMigrations keeps a failed migration a
  # visible, separate failure, and matches what the Helm chart's migrations Job does.
  vfps-migrate:
    image: ghcr.io/miracum/vfps:${VFPS_IMAGE_TAG:-v1.22.1} # x-release-please-version
    command: ["/opt/vfps/Vfps.dll", "migrate"]
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    environment:
      <<: *vfps-database-env
      DOTNET_EnableDiagnostics: "0"

  vfps:
    image: ghcr.io/miracum/vfps:${VFPS_IMAGE_TAG:-v1.22.1} # x-release-please-version
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      vfps-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    environment:
      <<: *vfps-database-env
      DOTNET_EnableDiagnostics: "0"
      Authorization__IsEnabled: "true"
      Authorization__Authority: ${VFPS_OIDC_AUTHORITY:?set VFPS_OIDC_AUTHORITY to the HTTPS issuer URL of your OIDC provider}
      Authorization__ClientId: ${VFPS_OIDC_CLIENT_ID:?set VFPS_OIDC_CLIENT_ID to the admin UI's confidential client id}
      Authorization__ClientSecret: ${VFPS_OIDC_CLIENT_SECRET:?set VFPS_OIDC_CLIENT_SECRET to the admin UI's client secret}
      # required rather than optional: left empty, every bearer token is rejected, and the gRPC and
      # REST APIs only accept bearer tokens once authorization is on
      Authorization__Audience: ${VFPS_OIDC_AUDIENCE:?set VFPS_OIDC_AUDIENCE to the audience API callers' tokens are issued for}
      Authorization__AdminRoles__0: ${VFPS_ADMIN_ROLE:?set VFPS_ADMIN_ROLE to the role that grants full access}
    # Long syntax on purpose: `docker compose publish` (as of Compose 5.6) fails with "expected a map
    # or struct, got string" on a short-syntax port that contains a variable, even though `up`
    # accepts it.
    ports:
      # REST API, admin UI and gRPC over HTTP/1.1, HTTP/2 and HTTP/3
      - target: 8080
        published: "8080"
        host_ip: ${VFPS_BIND_ADDRESS:-127.0.0.1}
      # HTTP/2-only for plaintext gRPC
      - target: 8081
        published: "8081"
        host_ip: ${VFPS_BIND_ADDRESS:-127.0.0.1}
      # Prometheus metrics
      - target: 8082
        published: "8082"
        host_ip: ${VFPS_BIND_ADDRESS:-127.0.0.1}

volumes:
  postgresql-data:
