name: ci

on:
  push:
    branches: [master]
  release:
    types: [created]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    uses: miracum/.github/.github/workflows/standard-build.yaml@56f97afca6189a2fafd4e5d7cbabc6c9b83c8a85 # v1.22.4
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      actions: read
      security-events: write
      # required by standard-build for artifact attestations/provenance uploads
      artifact-metadata: write
      attestations: write
    with:
      enable-build-test-layer: true
      enable-upload-test-image: true
      platforms: |
        linux/amd64
        linux/arm64
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # ct install (inside standard-chart-publish.yaml's install job) only runs on PRs that change
  # something under charts/vfps/ - it's gated by `ct list-changed`, a plain git diff scoped to
  # the chart directory that has no idea `chart.helm-extra-set-args` below even exists. Without
  # this, a PR that only touches src/ or the Dockerfile would build and push a new image but
  # never actually deploy it via the chart, silently skipping the one check that would catch an
  # image that fails its readiness/liveness probes or otherwise can't come up under Helm.
  detect-app-changes:
    name: detect changes affecting chart deployability
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes under src/, Dockerfile, or charts/ since the PR's base
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # only meaningful for pull_request events. push/release/merge_group already get a full
          # ct install regardless (list-changed's own base-branch diff has nothing to compare
          # against on those), so there's nothing for this job to add there.
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${BASE_SHA}" -- src/ Dockerfile charts/; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  chart:
    needs:
      - build
      - detect-app-changes
    uses: miracum/.github/.github/workflows/standard-chart-publish.yaml@a22046808f8ee1af34781418e0e59fd23be420c5 # v1.28.0
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for keyless chart signing and OIDC-based attestations
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      chart-path: charts/vfps
      # published as ghcr.io/miracum/vfps/charts/vfps rather than the default
      # ghcr.io/miracum/vfps/vfps, matching the .../charts/<name> layout used elsewhere in the org
      # (e.g. recruit's chart).
      registry: ghcr.io/${{ github.repository }}/charts
      lint-config: .github/ct/ct.yaml
      install-config: .github/ct/install.yaml
      # force ct install to run even when the PR doesn't touch charts/vfps/ itself, as long as it
      # changed something that could affect whether the chart still deploys (see
      # detect-app-changes above).
      install-all: ${{ needs.detect-app-changes.outputs.changed == 'true' }}
      # test ct install against the image this PR just built instead of the tag baked into
      # values.yaml, so a PR can't pass chart testing against a stale/unrelated release image.
      # Restricted to same-repo PRs: forked PRs never get their image pushed to ghcr.io (see
      # standard-build.yaml), so kind wouldn't be able to pull it - falls back to the chart's
      # default tag there, same as before this was added.
      helm-extra-set-args: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) && format('--set=image.tag={0}', needs.build.outputs.image-version) || '' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  add-code-coverage:
    runs-on: ubuntu-24.04
    name: add code coverage
    needs:
      - build
    permissions:
      # for add Coverage PR Comment
      pull-requests: write
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Download test image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}-test
          path: /tmp

      - name: Load test image
        run: |
          ls -lsa /tmp
          docker load --input /tmp/image-test.tar
          docker image ls

      - name: Copy unit test coverage reports from test container
        env:
          UNIT_TEST_IMAGE: ${{ fromJson(needs.build.outputs.test-image-meta-json).tags[0] }}
        run: |
          docker create --name=unit-test-container "${UNIT_TEST_IMAGE}"
          docker cp unit-test-container:/build/src/Vfps.Tests/coverage ./coverage

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # tag=v1.3.0
        with:
          filename: coverage/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 50"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          recreate: true
          path: code-coverage-results.md

  test-api:
    name: test api
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
      pull-requests: write
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download container image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lar /tmp
          docker load --input /tmp/image.tar
          docker image ls -a

      - name: Install grpcurl
        working-directory: /tmp
        env:
          GRPCURL_URL: https://github.com/fullstorydev/grpcurl/releases/download/v1.8.7/grpcurl_1.8.7_linux_x86_64.tar.gz
        run: |
          curl -LSs "$GRPCURL_URL" | tar xz && \
          mv ./grpcurl /usr/local/bin/grpcurl && \
          chmod +x /usr/local/bin/grpcurl && \
          grpcurl --version

      - name: Install ghz
        working-directory: /tmp
        env:
          GHZ_URL: https://github.com/bojand/ghz/releases/download/v0.110.0/ghz-linux-x86_64.tar.gz
        run: |
          curl -LSs "$GHZ_URL" | tar xz && \
          mv ./ghz /usr/local/bin/ghz && \
          chmod +x /usr/local/bin/ghz && \
          ghz --version

      - name: Start compose deployment
        env:
          VFPS_IMAGE_TAG: ${{ needs.build.outputs.image-version }}
        run: |
          echo "Using VFPS image tag ${VFPS_IMAGE_TAG}"
          docker compose --profile=test up -d

      - name: Wait for the healthz endpoint to be ready
        run: |
          curl --fail --retry 5 --retry-all-errors --connect-timeout 30 --max-time 60 --retry-delay 10 http://127.0.0.1:8080/healthz

      - name: Create a namespace for testing
        run: |
          grpcurl \
            -plaintext \
            -import-path src/Vfps/ \
            -proto src/Vfps/Protos/vfps/api/v1/namespaces.proto \
            -d '{"name": "test", "pseudonymGenerationMethod": "PSEUDONYM_GENERATION_METHOD_SECURE_RANDOM_BASE64URL_ENCODED", "pseudonymLength": 32}' \
            127.0.0.1:8081 \
            vfps.api.v1.NamespaceService/Create

      - name: Create pseudonyms from random inputs
        run: |
          ghz -n 5000 \
            --cpus 1 \
            --insecure \
            --import-paths src/Vfps/ \
            --proto src/Vfps/Protos/vfps/api/v1/pseudonyms.proto \
            --call vfps.api.v1.PseudonymService/Create \
            -d '{"originalValue": "{{randomString 32}}", "namespace": "test"}' \
            127.0.0.1:8081 | tee ghz-output.txt

      - name: Enhance ghz output for use as a PR comment
        run: |
          GHZ_OUTPUT_TXT=$(cat ghz-output.txt)
          {
            echo -e '---';
            echo -e '## ghz run statistics';
            echo -e '```console';
            echo -e "${GHZ_OUTPUT_TXT}";
            echo -e '```'
          } >> ghz-output.md

      - name: Append sticky comment with ghz output
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          append: true
          path: ghz-output.md

      - name: Print compose logs
        if: always()
        run: |
          docker compose --profile=test logs
          docker compose --profile=test down --volumes --remove-orphans

  test-e2e:
    name: test e2e (playwright)
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      contents: read
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download container image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lar /tmp
          docker load --input /tmp/image.tar
          docker image ls -a

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build the e2e test project and install its Playwright browser
        run: |
          dotnet build src/Vfps.PlaywrightTests --configuration=Release
          pwsh src/Vfps.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start compose deployment
        env:
          VFPS_IMAGE_TAG: ${{ needs.build.outputs.image-version }}
        run: |
          echo "Using VFPS image tag ${VFPS_IMAGE_TAG}"
          docker compose --profile=test up -d

      - name: Wait for the healthz endpoint to be ready
        run: |
          curl --fail --retry 5 --retry-all-errors --connect-timeout 30 --max-time 60 --retry-delay 10 http://127.0.0.1:8080/healthz

      - name: Run Playwright e2e tests against the running container
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: |
          # CSV-upload tests need the S3-backed object storage this default deployment doesn't
          # wire up (the "s3" compose profile's SeaweedFS) - see Vfps.PlaywrightTests/CsvJobsTests.cs.
          dotnet test src/Vfps.PlaywrightTests \
            --configuration=Release \
            --filter-not-trait "Category=RequiresS3"

      - name: Print compose logs
        if: always()
        run: |
          docker compose --profile=test logs
          docker compose --profile=test down --volumes --remove-orphans

  test-migrations:
    name: test migrations
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - build
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download container image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lar /tmp
          docker load --input /tmp/image.tar
          docker image ls -a

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run migrations tests
        env:
          VFPS_IMAGE_TAG: ${{ needs.build.outputs.image-version }}
        run: dotnet test src/Vfps.IntegrationTests --configuration=Release

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@56f97afca6189a2fafd4e5d7cbabc6c9b83c8a85 # v1.22.4
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    with:
      dotnet-version: "10.0.400"
      enable-verify-base-image-signature: false
      enable-validate-gradle-wrapper: false
      codeql-languages: '["csharp"]'
      # merge_group runs fail at the upload-sarif step with "Error: ref
      # 'refs/heads/gh-readonly-queue/master/pr-<n>-<sha>' not found in this repository" - CodeQL
      # code scanning results can only be associated with a persistent ref (a branch or PR ref),
      # and the merge queue's gh-readonly-queue ref is ephemeral. This is a genuine, still-open
      # upstream limitation acknowledged by GitHub - see
      # https://github.com/github/codeql-action/issues/1572 (open since 2023, no fix as of the
      # last activity in Feb 2025) - not something fixable via workflow inputs the way the
      # benchmarks.yaml `ref` input works around github-action-benchmark's own merge_group gap.
      # standard-lint.yaml's codeql-analyze job itself has no event-based `if:` to add this to
      # from here (unlike its zizmor/dependency-review/megalinter jobs, which are already
      # `if: github.event_name == 'pull_request'` for the same reason), so disabling it via this
      # input for merge_group specifically is the only caller-side lever available. The
      # pull_request-triggered run (before a PR enters the queue) and the push-triggered run
      # (right after it merges) both still run CodeQL normally - only the merge queue's redundant
      # re-validation pass is skipped.
      enable-codeql: ${{ github.event_name != 'merge_group' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
