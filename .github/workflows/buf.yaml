name: buf

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The module is rooted at src/Vfps/Protos, the same root Vfps.csproj compiles from - see the
      # comment on its Protobuf item for why the two have to agree.
      #
      # Checks formatting and lint, and on pull requests also breaking changes against the PR's
      # base commit - apply the "buf skip breaking" label to a PR that breaks the API on purpose.
      # The action only enables lint and format for pull_request events by default, so both are
      # forced on to keep them running in the merge queue too.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: src/Vfps/Protos
          lint: true
          format: true

  # The VOPRF server's gRPC contract, shared by Vfps.Voprf.Server and Vfps.Voprf.Client, is a buf
  # module of its own. It gets a job of its own rather than a second step above: buf-action keys
  # its pull request comment by workflow and job, so two steps in one job would overwrite each
  # other's comment.
  lint-voprf-contracts:
    name: lint voprf contracts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # same settings and reasoning as the job above
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: src/Vfps.Voprf.Contracts
          lint: true
          format: true
