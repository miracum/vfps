name: docs

on:
  pull_request:
    branches: [master]
    paths:
      - website/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - scripts/generate-api-reference.sh
      - scripts/api-reference.md.tmpl
      # the API reference page is generated from these
      - src/Vfps/Protos/**
      - .github/workflows/docs.yaml
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # this workflow publishes on release, so it must not restore anything a pull request
          # run could have written
          enable-cache: false

      # The API reference page is generated from the .proto files and not committed, so the site can
      # only be built after this.
      - name: Generate the API reference
        run: ./scripts/generate-api-reference.sh

      # --strict fails the build on broken links between pages.
      - name: Build site
        run: uv run --locked zensical build --strict

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # GitHub Pages serves the gh-pages branch, which also holds the benchmark history in
      # dev/bench/ that benchmarks.yaml commits there on every push to master. Everything else on
      # the branch is replaced by the freshly built site.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git clone --depth=1 --branch=gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          cd gh-pages

          git rm -r -q --ignore-unmatch -- . ':(exclude)dev/bench'
          cp -a ../site/. .
          # serve the files as they are rather than running them through Jekyll
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: publish site for ${SOURCE_SHA}"

          # The benchmark workflow may have pushed in the meantime. Its commits only ever touch
          # dev/bench/, which this one leaves alone, so rebasing onto them can't conflict.
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected, rebasing onto the current gh-pages."
            git pull -q --rebase origin gh-pages
          done
          exit 1
