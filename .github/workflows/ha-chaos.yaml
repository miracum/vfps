name: ha chaos testing

# Stands vfps up in the configuration docs/deployment/high-availability.md argues for - three
# replicas spread across three zones, backed by a replicated CloudNativePG cluster - and breaks it on
# purpose while asserting that no pseudonym it already handed out is lost or changes identity.
#
# See docs/testing/ha-chaos-testing.md. Deliberately not run on pull requests: it takes the best part
# of an hour, and a chaos test that gates merges is a chaos test that gets disabled.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "released vfps image tag to test instead of building from this checkout"
        required: false
        type: string
      scenarios:
        description: "comma-separated scenario list (default: all). Use 'baseline' alone to calibrate the error budget."
        required: false
        type: string
      rate-per-second:
        description: "offered request rate for the load generator (default: 50)"
        required: false
        type: string
      error-budget:
        description: "P1 failure-rate budget as a fraction, e.g. 0.005 (default: 0.005)"
        required: false
        type: string
  schedule:
    # weekly, Sunday at 03:17
    - cron: "17 03 * * 0"

permissions:
  contents: read

concurrency:
  group: ha-chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ha-chaos:
    name: ha chaos testing
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install kind
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          kind version

      - name: Build images
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # The load generator carries the resilience test itself, so it is always built from this
          # checkout. The application image is only built here when no released tag was requested -
          # testing master's HA behaviour means testing master's image, not the last release.
          docker buildx build \
            --load \
            --target=stress-test \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t ghcr.io/miracum/vfps/stress-test:ci \
            .

          if [ -n "${IMAGE_TAG}" ]; then
            echo "testing released image tag ${IMAGE_TAG}"
            {
              echo "VFPS_IMAGE_TAG=${IMAGE_TAG}"
              echo "LOAD_VFPS_IMAGE=false"
            } >> "${GITHUB_ENV}"
          else
            docker buildx build \
              --load \
              --cache-from=type=gha \
              --cache-to=type=gha,mode=max \
              -t ghcr.io/miracum/vfps:ci \
              .
            {
              echo "VFPS_IMAGE_TAG=ci"
              echo "LOAD_VFPS_IMAGE=true"
            } >> "${GITHUB_ENV}"
          fi

          docker image ls

      - name: Run the HA chaos test
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ha-chaos-artifacts
          # Empty values fall through to the defaults in run.sh.
          SCENARIOS: ${{ inputs.scenarios }}
          RESILIENCE_RATE_PER_SECOND: ${{ inputs.rate-per-second }}
          RESILIENCE_ERROR_BUDGET: ${{ inputs.error-budget }}
        run: ./tests/chaos/ha/run.sh all

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-chaos-artifacts
          path: ha-chaos-artifacts/
          retention-days: 14
          if-no-files-found: warn
