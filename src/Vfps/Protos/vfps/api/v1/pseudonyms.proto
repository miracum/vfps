syntax = "proto3";

package vfps.api.v1;

import "Protos/google/api/annotations.proto";
import "Protos/vfps/api/v1/meta.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Vfps.Protos";

// service to manage pseudonyms
service PseudonymService {
  // create a new pseudonym in the given namespace for an original value
  rpc Create(PseudonymServiceCreateRequest) returns (PseudonymServiceCreateResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/pseudonyms"
      body: "*"
    };
  }

  // resolve the pseudonym already stored for an original value, creating nothing. Returns
  // NOT_FOUND when the namespace holds none - the difference from Create, which would generate
  // one. Requires the same write access Create does: this is the same forward mapping, and a
  // caller who may create a pseudonym for a value may already learn it that way.
  //
  // POST with the original value in the body, deliberately, even though this reads rather than
  // writes: a GET would put the original value in the request path, where it would be recorded by
  // every access log, proxy and browser history between the caller and this service. No operation
  // on this API takes an original value in a URL.
  rpc Resolve(PseudonymServiceResolveRequest) returns (PseudonymServiceResolveResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/pseudonyms:resolve"
      body: "*"
    };
  }

  // get information about the given pseudonym. Including its original value.
  rpc Get(PseudonymServiceGetRequest) returns (PseudonymServiceGetResponse) {
    option (google.api.http) = {get: "/v1/namespaces/{namespace}/pseudonyms/{pseudonym_value}"};
  }

  // list all pseudonyms in the given namespace. Unlike Get, this never returns original_value -
  // reverse lookup of a specific pseudonym is a separate, single-record operation by design.
  rpc List(PseudonymServiceListRequest) returns (PseudonymServiceListResponse) {
    option (google.api.http) = {get: "/v1/namespaces/{namespace}/pseudonyms"};
  }
}

// request to list all pseudonyms in a namespace
message PseudonymServiceListRequest {
  // the namespace to list the containing pseudonyms of
  string namespace = 1;
  // specify the maximum number of results to be returned by the server.
  // If the page_size is 0, the server will decide the number of results to be returned.
  int32 page_size = 2;
  // an opaque pagination token. Use this field to request a specific page of the list results.
  string page_token = 3;
  // include the total number of pseudonyms in the namespace as part of the response
  bool include_total_size = 4;
}

// response listing all pseudonyms in a namespace
message PseudonymServiceListResponse {
  // the namespace containing the pseudonyms
  string namespace = 1;
  // if `include_total_size` is set to `true` in the request,
  // this is the total number of pseudonyms in the namespace
  optional int64 total_size = 2;
  // an opaque pagination token. Use this field to request the next
  // page of results by setting the request's `page_token` to this value.
  string next_page_token = 3;
  // list of pseudonyms in the namespace
  repeated Pseudonym pseudonyms = 4;
}

// contents of the PseudonymServiceList pagination token: the position of the last-seen
// pseudonym in the (created_at desc, original_value desc) ordering, used for keyset/seek
// pagination rather than an offset - this scales to hundreds of millions of rows per
// namespace, where an offset-based token would degrade linearly with page depth.
message PseudonymListPaginationToken {
  // created_at of the last-seen pseudonym in the previous page
  google.protobuf.Timestamp created_at = 1;
  // original_value of the last-seen pseudonym in the previous page - tie-breaker for
  // pseudonyms sharing the same created_at
  string original_value = 2;
  // sequence_number of the last-seen pseudonym in the previous page - final tie-breaker for
  // pseudonyms sharing the same (created_at, original_value), which a multi-psn namespace
  // (see Namespace.allows_multiple_pseudonyms) can otherwise produce
  int64 sequence_number = 3;
}

// message to fetch details for a given pseudonym
message PseudonymServiceGetRequest {
  // the namespace the pseudonym is a part of
  string namespace = 1;
  // the actual pseudonym
  string pseudonym_value = 2;
}

// response for getting a pseudonym entity
message PseudonymServiceGetResponse {
  // the found pseudonym
  Pseudonym pseudonym = 1;
}

// request to pseudonymize and store a given value
message PseudonymServiceCreateRequest {
  // the namespace in which the pseudonym should be created
  string namespace = 1;
  // the original value to be pseudonymized
  string original_value = 2;
  // how many distinct pseudonyms to store for this original value. Only valid to set above 1
  // when the target namespace has allows_multiple_pseudonyms set - unset (or 1) preserves
  // today's single-pseudonym behavior for every other namespace. If fewer than this many
  // pseudonyms already exist for the original value, exactly the missing ones are generated and
  // added; if this many or more already exist, the existing set is returned unchanged.
  optional int64 count = 3;
}

// response for creating a pseudonym entity
message PseudonymServiceCreateResponse {
  // the created pseudonym. For a multi-psn namespace this is always the first (sequence_number
  // 0) pseudonym of the full set below, kept for backwards compatibility with callers that only
  // read this field.
  Pseudonym pseudonym = 1;
  // every pseudonym stored for the requested original value after this call - length 1 unless
  // the target namespace allows multiple pseudonyms per original value.
  repeated Pseudonym pseudonyms = 2;
}

// request to resolve the pseudonym already stored for an original value
message PseudonymServiceResolveRequest {
  // the namespace to look the original value up in
  string namespace = 1;
  // the original value whose pseudonym is wanted. Nothing is stored for it - if this namespace
  // holds no pseudonym for it, the call returns NOT_FOUND rather than creating one.
  string original_value = 2;
}

// response for resolving an original value's existing pseudonym
message PseudonymServiceResolveResponse {
  // the pseudonym found. For a multi-psn namespace this is the first (sequence_number 0)
  // pseudonym of the full set below, mirroring PseudonymServiceCreateResponse.
  Pseudonym pseudonym = 1;
  // every pseudonym stored for the requested original value - length 1 unless the namespace
  // allows multiple pseudonyms per original value. Never empty: an original value with none
  // returns NOT_FOUND instead.
  repeated Pseudonym pseudonyms = 2;
}

// the pseudonym entity
message Pseudonym {
  // metadata about the pseudonym
  Meta meta = 1;
  // the namespace of the pseudonym
  string namespace = 2;
  // the original value that was pseudonymized. Only ever populated by Create and the dedicated
  // reverse-lookup operation - List never sets this, by design.
  optional string original_value = 3;
  // the pseudonym created for the original value
  string pseudonym_value = 4;
  // this pseudonym's position (starting at 0) among possibly multiple pseudonyms stored for the
  // same original value in a multi-psn namespace. Always 0 otherwise.
  int64 sequence_number = 5;
}
