# vfps in the configuration docs/deployment/high-availability.md argues for, pointed at the
# CloudNativePG cluster in cnpg-cluster.yaml rather than the bundled single-instance PostgreSQL.
#
# Verified against the chart with `helm template`: this needs no chart changes.

replicaCount: 3

postgres:
  # The bundled subchart is a single instance - any restart of it is a total outage, which would
  # make every database chaos scenario a foregone conclusion.
  enabled: false

database:
  host: vfps-db-rw # CNPG repoints -rw at the new primary on promotion; -ro and -r would send writes to a standby
  port: 5432
  database: vfps
  username: vfps_admin # must match the CNPG cluster's bootstrap.initdb.owner
  existingSecret: vfps-db-app # generated by CloudNativePG as <cluster>-app
  existingSecretKey: password
  additionalConnectionStringParameters: "Timeout=60;Max Auto Prepare=5;Maximum Pool Size=25;"

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  # DoNotSchedule rather than the chart's ScheduleAnyway example: silently tolerating an unspread
  # placement would mean the pod-kill scenario runs against three replicas on one node and passes
  # for the wrong reason.
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: vfps
        app.kubernetes.io/component: api

# Left at chart defaults deliberately - 60s grace, 5s preStop, 25s shutdown timeout are exactly what
# the rolling-upgrade scenario exists to validate.

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 256Mi

serviceMonitor:
  enabled: false

migrationsJob:
  enabled: true
