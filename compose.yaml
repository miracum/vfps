services:
  postgresql:
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    environment:
      # kics-scan ignore-line
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    ports:
      - "127.0.0.1:35432:5432"

  # Jaeger v2 - a single OpenTelemetry Collector distribution that speaks OTLP natively (the
  # legacy Jaeger agent/Thrift protocol used by v1 is gone), so this is the ingestion endpoint
  # Tracing:Otlp:Endpoint points at, not a proprietary Jaeger exporter.
  # https://www.jaegertracing.io/docs/2.19/getting-started/
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    profiles:
      - jaeger
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:16686:16686"

  # Local OIDC provider for testing Authorization:IsEnabled=true. Imports tests/keycloak/vfps-realm.json,
  # which pre-configures the "vfps-web" client and two users: admin/admin (realm role vfps-admin) and
  # reader/reader (realm role vfps-ns-development-read). Not started by default - requires the
  # "keycloak" compose profile.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    restart: unless-stopped
    command: start-dev --import-realm
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    environment:
      KEYCLOAK_ADMIN: admin
      # kics-scan ignore-line
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./tests/keycloak/vfps-realm.json:/opt/keycloak/data/import/vfps-realm.json:ro
    profiles:
      - keycloak
    ports:
      - "127.0.0.1:8180:8080"

  # Local S3-compatible object storage for testing S3__IsEnabled=true (CSV pseudonymization
  # jobs). Not started by default - requires the "s3" compose profile.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -master.telemetry=false
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # used as the S3 admin identity
      AWS_ACCESS_KEY_ID: "vfps"
      # kics-scan ignore-line
      AWS_SECRET_ACCESS_KEY: "vfps-minio-secret"
      # the bucket vfps uploads/downloads CSV job files to/from, created on startup if it
      # doesn't exist yet
      S3_BUCKET: "vfps-csv-jobs"
    healthcheck:
      # the S3 /healthz endpoint is ready before the bucket is created, so check the bucket instead
      test:
        - CMD-SHELL
        - curl -sf -o /dev/null -I --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" "http://localhost:9000/$$S3_BUCKET" # gitleaks:allow
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 512m
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    profiles:
      - s3
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8888:8888"

  vfps:
    image: ghcr.io/miracum/vfps:${VFPS_IMAGE_TAG:-v1.22.1} # x-release-please-version
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "1"
        reservations:
          memory: 128m
          cpus: "1"
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    profiles:
      - test
    environment:
      DOTNET_EnableDiagnostics: "0"
      ForceRunDatabaseMigrations: "true"
      ConnectionStrings__PostgreSQL: "Host=postgresql:5432;Database=vfps;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
      PGUSER: postgres
      # kics-scan ignore-line
      PGPASSWORD: postgres
      Authorization__Authority: "http://keycloak:8080/realms/vfps"
      Authorization__ClientId: "vfps-web"
      # kics-scan ignore-line
      Authorization__ClientSecret: "vfps-web-secret"
      Authorization__AdminRoles__0: "vfps-admin"
      # vfps-issued access tokens: off by default in a real deployment, on here so the
      # Access tokens and Service accounts pages are reachable when trying the stack out.
      Authorization__AccessTokens__IsEnabled: "true"
      # requires externally-reachable seaweedfs. host.docker-internal doesnt quite work.
      #S3__IsEnabled: "true"
      S3__ServiceUrl: "http://host.docker.internal:9000"
      S3__AccessKey: "vfps"
      # kics-scan ignore-line
      S3__SecretKey: "vfps-minio-secret"
      S3__Bucket: "vfps-csv-jobs"
      S3__ForcePathStyle: "true"
      S3__AllowedOrigins__0: "http://localhost:8080"
    ports:
      # Http1, Http2, Http3
      - "127.0.0.1:8080:8080"
      # Http2-only for plaintext gRPC
      - "127.0.0.1:8081:8081"
