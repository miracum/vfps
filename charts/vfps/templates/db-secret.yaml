{{- if and (not .Values.postgres.enabled) (not .Values.database.existingSecret) (not .Values.database.tls.clientCertificate.existingSecret.name) }}
# Without this, `database.password` was silently dead: vfps.database.db-secret-name resolves to
# this name whenever an external database is used with no existingSecret, and every pod plus the
# migrations job mounts it - but nothing ever created it, so they all failed with
# CreateContainerConfigError. The key has to stay "postgres-password" to match
# vfps.database.db-secret-key's own fallback.
#
# A client certificate short-circuits all of that: `cert` authentication replaces the
# password, so there is nothing for this Secret to hold and creating it would only publish
# `database.password`'s default into the namespace. See vfps.database.password-env, which
# drops the matching PGPASSWORD entries under the same condition.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vfps.fullname" . }}-db-secret
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.database.password | b64enc | quote }}
{{- end }}
