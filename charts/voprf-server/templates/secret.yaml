{{- if and (ne .Values.key.source "Ephemeral") (not .Values.key.existingSecret) }}
{{/*
Only rendered when the seed was supplied inline. Prefer key.existingSecret: a Secret this chart
creates is stored in the release, so the value ends up in Helm's release history as well.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voprf-server.keySecretName" . }}
  labels:
    {{- include "voprf-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.key.existingSecretKey }}: {{ .Values.key.value | quote }}
{{- end }}
