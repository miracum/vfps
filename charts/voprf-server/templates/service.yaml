apiVersion: v1
kind: Service
metadata:
  name: {{ include "voprf-server.fullname" . }}
  labels:
    {{- include "voprf-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
  selector:
    {{- include "voprf-server.selectorLabels" . | nindent 4 }}
